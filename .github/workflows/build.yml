name: Build and Test Compiler

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v3

    - name: Install LLVM and Clang Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y llvm clang gcc

    - name: Compile Self-Hosted Compiler Code
      run: |
        chmod +x bin/compiler.out
        ./bin/compiler.out main.cl -o zkc

    - name: Test Native Compilation Flow
      run: |
        ./zkc input.cl -o input.out
        ./input.out

    - name: Upload Binary to GitHub Release
      if: startsWith(github.ref, 'refs/tags/v')
      uses: softprops/action-gh-release@v1
      with:
        files: zkc
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
