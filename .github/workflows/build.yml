name: Build and Test Compiler

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v3

    - name: Install LLVM and Clang Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y llvm clang gcc

    - name: Compile Self-Hosted Compiler Code
      run: |
        chmod +x bin/compiler.out
        ./bin/compiler.out main.cl -o zkc || true
        echo "=== COMPILER RUN COMPLETED ==="
        ls -la
        if [ ! -f zkc ]; then
          echo "=== COMPILATION FAILED ==="
          echo "Checking main.ll file if exists..."
          if [ -f main.ll ]; then
             echo "=== main.ll EXISTS, RUNNING MANUAL CLANG ==="
             clang main.ll -no-pie -o zkc
          else
             echo "=== main.ll DOES NOT EXIST! ==="
          fi
          exit 1
        fi

    - name: Test Native Compilation Flow
      run: |
        ./zkc input.cl -o input.out
        ./input.out
